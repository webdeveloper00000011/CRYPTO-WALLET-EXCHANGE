name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies and build web app
        run: |
          if [ -f "bun.lock" ] || [ -f "bun.lockb" ]; then
            bun install --frozen-lockfile || bun install
            bun run build
          else
            npm install --legacy-peer-deps || npm install
            npm run build
          fi

      - name: Package Android APK with Cordova
        run: |
          npm install -g cordova

          WEB_SRC=""
          for d in dist build out public; do
            if [ -d "$d" ] && [ -f "$d/index.html" ]; then
              WEB_SRC="$d"
              break
            fi
          done

          if [ -z "$WEB_SRC" ]; then
            echo "No built web directory with index.html found."
            exit 1
          fi

          cordova create cordova_app com.webdeveloper0000011.cryptowalletexchange "CryptoWalletExchange"
          cd cordova_app
          rm -rf www/*
          cp -r "../$WEB_SRC/"* www/

          cordova platform add android
          cordova plugin add cordova-plugin-inappbrowser || true
          cordova build android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-wallet-exchange-apk
          path: cordova_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
